  args: {code: "Li4vLi4vZXRjL3Bhc3N3ZA== %2e%2e%2f \\u002e"}
  expect: ok
  canonical: {code: "Li4vLi4vZXRjL3Bhc3N3ZA== %2e%2e%2f \\u002e"}

