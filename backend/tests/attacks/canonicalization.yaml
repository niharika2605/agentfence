# ---------------- table names ----------------
- id: table-ok-plain
  tool: db.query
  args: {table: "customers"}
  expect: ok
  canonical: {table: "customers", filters: {}, limit: 10}

- id: table-ok-confidential-table-is-policys-job
  tool: db.query
  args: {table: "salaries"}
  expect: ok
  canonical: {table: "salaries"}

- id: table-ok-url-encoded-letter
  tool: db.query
  args: {table: "%73alaries"}
