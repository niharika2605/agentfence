# ---------------- email addresses ----------------
- id: email-ok-plain
  tool: email.send
  args: {to: "me@company.com", subject: "Hi", body: "Text"}
  expect: ok
  canonical: {to: "me@company.com"}

- id: email-ok-cleaned
  tool: email.send
  args: {to: "Me.Name+Tag@Company.COM", subject: "Hi", body: "Text"}
  expect: ok
  canonical: {to: "me.name+tag@company.com"}

- id: email-ok-trailing-dot-domain
  tool: email.send
  args: {to: "me@company.com.", subject: "Hi", body: "Text"}
  expect: ok
  canonical: {to: "me@company.com"}

- id: email-ok-encoded-at-sign
  tool: email.send
  args: {to: "me%40company.com", subject: "Hi", body: "Text"}
  expect: ok
  canonical: {to: "me@company.com"}
  layers: {to: [url]}

- id: email-ok-unicode-escape
  tool: email.send
  args: {to: "\\u006de@company.com", subject: "Hi", body: "Text"}
  expect: ok
  canonical: {to: "me@company.com"}
  layers: {to: [unicode]}

- id: email-ok-international-domain
  tool: email.send
  args: {to: "a@b\u00fccher.example", subject: "Hi", body: "Text"}
  expect: ok
  canonical: {to: "a@xn--bcher-kva.example"}

- id: email-ok-attacker-address-is-policys-job
  tool: email.send
  args: {to: "attacker@evil.example", subject: "Hi", body: "Text"}
  expect: ok
  canonical: {to: "attacker@evil.example"}

- id: email-body-is-never-decoded
