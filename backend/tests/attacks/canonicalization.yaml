  args: {to: "me@company.com", subject: "Hi", body: "%2e%2e%2f and \\u002e and Li4vLi4vZXRjL3Bhc3N3ZA=="}
  expect: ok
  canonical: {body: "%2e%2e%2f and \\u002e and Li4vLi4vZXRjL3Bhc3N3ZA=="}

- id: email-two-at-signs
  tool: email.send
