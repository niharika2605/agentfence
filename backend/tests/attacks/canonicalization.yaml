# Canonicalization attack corpus (Day 12).
# Each entry is one tool call. "expect: ok" means the call passes canonicalization and
# must come out as the "canonical" values. "expect: block" means a block Decision with
# the given "code" (default CANONICALIZATION_FAILED).
# Strings use double quotes. In YAML, "\\u002e" is the 6 characters \u002e (text for the
# decoder), while "\u202e" is one real character.
# Policy still decides about protected files. Canonicalization only shows the real target.

# ---------------- paths that are fine ----------------
- id: path-ok-plain
  tool: file.read
  args: {path: "/workspace/public/readme.txt"}
  expect: ok
  canonical: {path: "/workspace/public/readme.txt"}

- id: path-ok-double-slashes
  tool: file.read
  args: {path: "/workspace//public///readme.txt"}
  expect: ok
  canonical: {path: "/workspace/public/readme.txt"}

- id: path-ok-relative
  tool: file.read
  args: {path: "public/readme.txt"}
  expect: ok
  canonical: {path: "/workspace/public/readme.txt"}

- id: path-ok-dotdot-inside-root
  tool: file.read
  args: {path: "/workspace/public/../notes/meeting.txt"}
  expect: ok
  canonical: {path: "/workspace/notes/meeting.txt"}

- id: path-ok-encoded-dotdot-inside-root
  tool: file.read
  args: {path: "/workspace/public/%2e%2e/notes/meeting.txt"}
  expect: ok
  canonical: {path: "/workspace/notes/meeting.txt"}
  layers: {path: [url]}

- id: path-ok-double-encoded-dotdot-inside-root
  tool: file.read
  args: {path: "/workspace/public/%252e%252e/notes/meeting.txt"}
  expect: ok
  canonical: {path: "/workspace/notes/meeting.txt"}
  layers: {path: [url, url]}

- id: path-ok-symlink-inside-root
  tool: file.read
  args: {path: "/workspace/public/latest"}
  expect: ok
  canonical: {path: "/workspace/public/readme.txt"}

- id: path-ok-non-english-name
  tool: file.read
  args: {path: "/workspace/public/\u0930\u093f\u092a\u094b\u0930\u094d\u091f.txt"}
  expect: ok
  canonical: {path: "/workspace/public/\u0930\u093f\u092a\u094b\u0930\u094d\u091f.txt"}

# ---------------- paths that reach a protected file (policy must block these) ----------------
- id: path-exposes-secret-via-symlink
  tool: file.read
  args: {path: "/workspace/public/shortcut"}
  expect: ok
  canonical: {path: "/workspace/keys/api_keys.txt"}

- id: path-exposes-secret-via-encoded-dotdot
  tool: file.read
  args: {path: "/workspace/public/%2e%2e/keys/api_keys.txt"}
  expect: ok
  canonical: {path: "/workspace/keys/api_keys.txt"}
  layers: {path: [url]}

- id: path-exposes-secret-via-unicode-escape
  tool: file.read
  args: {path: "/workspace/public/\\u002e\\u002e/keys/api_keys.txt"}
  expect: ok
  canonical: {path: "/workspace/keys/api_keys.txt"}
  layers: {path: [unicode]}

- id: path-exposes-secret-via-base64
  tool: file.read
  args: {path: "L3dvcmtzcGFjZS9rZXlzL2FwaV9rZXlzLnR4dA=="}
  expect: ok
  canonical: {path: "/workspace/keys/api_keys.txt"}
  layers: {path: [base64]}

